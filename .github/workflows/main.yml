name: Build Windows EXE

# 触发条件
on:
  push:
    branches: [ "main", "master" ] # 当推送到 main 或 master 分支时触发
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 开启手动点击运行按钮，非常实用！

jobs:
  build:
    runs-on: windows-latest # 指定使用 GitHub 的 Windows 服务器进行打包

    steps:
    - name: 检出代码 (Checkout)
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # 使用 Python 3.11

    - name: 安装依赖 (Install dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # 如果你后续用到了其他第三方库，也可以在这里加上 pip install xxx

    - name: 使用 PyInstaller 打包
      run: |
        # --noconsole 隐藏黑框，--onefile 打包成单文件，--name 指定输出名字
        pyinstaller --noconsole --onefile --name Gost_GUI gost_gui.py

    - name: 上传打包好的 EXE 文件 (Upload Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Gost_GUI_Windows # 别人下载时的压缩包名字
        path: dist/Gost_GUI.exe # 告诉 GitHub 从哪里提取打包好的文件
